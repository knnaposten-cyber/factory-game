<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundry Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#4A3C45; --panel:#3B2F37; --ink:#F4EADB; --muted:#BFAFB5;
  --line:#5E4E58; --accent:#F0A03C; --teal:#5FB7A8; --ore:#B98A5E;
  --metal:#BFCBD6; --belt:#7E8D9C; --good:#8FD18F;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:10px 16px; border-bottom:1px solid var(--line);
}
h1{
  font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900;
  font-size:30px; line-height:1; margin:0; margin-right:auto; letter-spacing:.01em;
}
.stat{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.stat b{
  display:block; color:var(--ink); font-family:"Big Shoulders Display",sans-serif;
  font-size:24px; font-weight:700; line-height:1.1;
}
.controls{display:flex; gap:8px}
main{flex:1; display:grid; grid-template-columns:1fr 264px; min-height:0}
#stage{position:relative; min-width:0; min-height:0; overflow:hidden}
canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair}
aside{
  border-left:1px solid var(--line); background:var(--panel);
  padding:18px 16px; overflow:auto; font-size:14px; line-height:1.5;
}
aside h2{
  font-family:"Big Shoulders Display",sans-serif; font-weight:700;
  font-size:20px; margin:0 0 8px;
}
aside p{margin:0 0 18px; color:var(--muted)}
#goals{list-style:none; padding:0; margin:0}
#goals li{
  display:flex; justify-content:space-between; gap:10px;
  padding:9px 0; border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
#goals li.done{color:var(--good)}
#goals li.done span:first-child::before{content:"✓ "; font-weight:600}
#status{min-height:20px; margin:0 0 14px; color:var(--accent); font-weight:500}
footer{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
  padding:10px 12px; border-top:1px solid var(--line); background:var(--panel);
}
button{
  font:inherit; color:var(--ink); background:transparent;
  border:1px solid var(--line); border-radius:6px;
  padding:8px 12px; cursor:pointer; min-height:40px;
  display:inline-flex; align-items:center; gap:8px;
}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
button small{opacity:.7; font-size:12px}
kbd{
  font-size:11px; border:1px solid currentColor; border-radius:3px;
  padding:0 4px; opacity:.6; line-height:16px;
}
@media (max-width:720px){
  main{grid-template-columns:1fr; grid-template-rows:1fr auto}
  aside{border-left:0; border-top:1px solid var(--line); max-height:28vh}
  h1{font-size:24px}
}
</style>
</head>
<body>
<header>
  <h1>Foundry Line</h1>
  <div class="stat">Cash<b id="money">$0</b></div>
  <div class="stat">Ingots sold<b id="sold">0</b></div>
  <div class="controls">
    <button id="pauseBtn" type="button">Pause <kbd>Space</kbd></button>
    <button id="speedBtn" type="button">1×</button>
    <button id="resetBtn" type="button">New map</button>
    <button id="sheetBtn" type="button">Sprites <kbd>G</kbd></button>
  </div>
</header>

<main>
  <div id="stage"><canvas id="cv" aria-label="Factory grid"></canvas></div>
  <aside>
    <h2>Goals</h2>
    <p id="help">Drop miners on ore. Run conveyors to a smelter to make ingots, then send everything into a sink to earn cash.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <ol id="goals"></ol>
  </aside>
</main>

<footer id="toolbar">
  <button type="button" data-tool="conveyor"><kbd>1</kbd> Conveyor <small>$1</small></button>
  <button type="button" data-tool="miner"><kbd>2</kbd> Miner <small>$10</small></button>
  <button type="button" data-tool="smelter"><kbd>3</kbd> Smelter <small>$30</small></button>
  <button type="button" data-tool="sink"><kbd>4</kbd> Sink <small>$15</small></button>
  <button type="button" data-tool="remove"><kbd>X</kbd> Remove</button>
  <button type="button" id="rotBtn"><kbd>R</kbd> Rotate</button>
</footer>

<script>
(() => {
  const COLS = 22, ROWS = 14;
  const TICK_MS = 450;
  const TAU = Math.PI * 2;
  const DIRS = [[1,0],[0,1],[-1,0],[0,-1]]; // right, down, left, up
  const COST = { conveyor: 1, miner: 10, smelter: 30, sink: 15 };
  const VALUE = { ore: 1, ingot: 6 };
  const START_CASH = 70;

  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const moneyEl = document.getElementById('money');
  const soldEl = document.getElementById('sold');
  const pauseBtn = document.getElementById('pauseBtn');
  const speedBtn = document.getElementById('speedBtn');
  const goalsEl = document.getElementById('goals');
  const statusEl = document.getElementById('status');
  const toolbar = document.getElementById('toolbar');

  let dpr = window.devicePixelRatio || 1;
  let cw = 0, ch = 0, ts = 32, ox = 0, oy = 0;
  let T = {};

  let grid, money, tick, paused, speed, tool, rot, stats, hover, painting, statusTimer;
  let lastTile = null;

  // ---- Sprite sheet ----
  const sheet = new Image();
  let sheetReady = false;
  sheet.onload = () => { sheetReady = true; };
  sheet.src = 'Preview.png';
  const SHEET = { x0: 256, y0: 51, t: 32, pitch: 34, cols: 12, rows: 11 };
  const SPR = {
    floor:   [0, 0],
    belt:    [1, 2],
    miner:   [6, 7],
    smelter: [4, 7],
    sink:    [3, 10],
  };
  function sprite(rc, x, y, w, h, rot = 0) {
    const sx = SHEET.x0 + rc[0] * SHEET.pitch, sy = SHEET.y0 + rc[1] * SHEET.pitch;
    if (rot) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(rot);
      ctx.drawImage(sheet, sx, sy, SHEET.t, SHEET.t, -w / 2, -h / 2, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(sheet, sx, sy, SHEET.t, SHEET.t, x, y, w, h);
    }
  }

  const goals = [
    { label: 'Mine 10 ore',    cur: () => stats.mined,   goal: 10 },
    { label: 'Smelt 5 ingots', cur: () => stats.smelted, goal: 5 },
    { label: 'Earn $100',      cur: () => stats.earned,  goal: 100 },
    { label: 'Sell 25 ingots', cur: () => stats.sold,    goal: 25 },
    { label: 'Earn $1,000',    cur: () => stats.earned,  goal: 1000 },
  ];

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    T = {
      paper: g('--paper'), panel: g('--panel'), ink: '#3A2C35', muted: g('--muted'),
      line: g('--line'), accent: g('--accent'), teal: g('--teal'), ore: g('--ore'),
      metal: g('--metal'), belt: g('--belt')
    };
  }

  function makeCell() {
    return { type: null, dir: 0, buf: null, timer: 0, inCount: 0, ore: false };
  }

  function genOre() {
    const blobs = [[6, ROWS / 2, 2.6], [COLS - 6, 4, 2.2], [COLS - 7, ROWS - 4, 2.2], [4, 2, 1.6]];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      for (const [bx, by, r] of blobs) {
        const d = Math.hypot(x - bx, y - by);
        if (d < r && Math.random() < 0.85) grid[y][x].ore = true;
      }
    }
  }

  function newGame() {
    grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, makeCell));
    genOre();
    money = START_CASH; tick = 0; paused = false; speed = 1;
    tool = 'conveyor'; rot = 0; hover = null;
    stats = { mined: 0, smelted: 0, earned: 0, sold: 0 };
    flash('');
    updateUI(true);
  }

  const at = (x, y) => (x >= 0 && y >= 0 && x < COLS && y < ROWS) ? grid[y][x] : null;

  function accepts(x, y, sx, sy, item) {
    const c = at(x, y);
    if (!c) return false;
    if (c.type === 'conveyor') {
      if (c.buf) return false;
      const [dx, dy] = DIRS[c.dir];
      if (x + dx === sx && y + dy === sy) return false; // can't feed from its front
      return true;
    }
    if (c.type === 'smelter') return item === 'ore' && c.inCount < 4;
    if (c.type === 'sink') return true;
    return false;
  }

  function give(x, y, sx, sy, item) {
    if (!accepts(x, y, sx, sy, item)) return false;
    const c = at(x, y);
    if (c.type === 'conveyor') c.buf = { item, moved: tick };
    else if (c.type === 'smelter') c.inCount++;
    else if (c.type === 'sink') earn(item);
    return true;
  }

  function earn(item) {
    money += VALUE[item];
    stats.earned += VALUE[item];
    if (item === 'ingot') stats.sold++;
  }

  function push(x, y, item) {
    const start = tick % 4;
    for (let i = 0; i < 4; i++) {
      const [dx, dy] = DIRS[(start + i) % 4];
      if (give(x + dx, y + dy, x, y, item)) return true;
    }
    return false;
  }

  function step() {
    tick++;
    // Conveyors move their item forward one tile per tick.
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = grid[y][x];
      if (c.type === 'conveyor' && c.buf && c.buf.moved !== tick) {
        const [dx, dy] = DIRS[c.dir];
        if (give(x + dx, y + dy, x, y, c.buf.item)) c.buf = null;
      }
    }
    // Miners and smelters produce and push output.
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = grid[y][x];
      if (c.type === 'miner') {
        if (!c.buf) {
          c.timer++;
          if (c.timer >= 2) { c.timer = 0; c.buf = { item: 'ore' }; stats.mined++; }
        }
        if (c.buf && push(x, y, c.buf.item)) c.buf = null;
      } else if (c.type === 'smelter') {
        if (!c.buf && c.inCount > 0) {
          c.timer++;
          if (c.timer >= 2) {
            c.timer = 0; c.inCount--; c.buf = { item: 'ingot' }; stats.smelted++;
          }
        } else if (!c.buf) {
          c.timer = 0;
        }
        if (c.buf && push(x, y, 'ingot')) c.buf = null;
      }
    }
  }

  function place(x, y) {
    const c = at(x, y);
    if (!c) return;
    if (tool === 'remove') {
      if (c.type) {
        money += Math.floor(COST[c.type] / 2);
        c.type = null; c.buf = null; c.dir = 0; c.inCount = 0; c.timer = 0;
      }
      return;
    }
    if (c.type === tool) {
      if (tool === 'conveyor') c.dir = (c.dir + 1) % 4;
      return;
    }
    if (c.type) return;
    if (tool === 'miner' && !c.ore) return flash('Miners need ore underneath.');
    if (money < COST[tool]) return flash('Not enough cash.');
    money -= COST[tool];
    c.type = tool; c.dir = rot; c.buf = null; c.timer = 0; c.inCount = 0;
  }

  function flash(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    if (msg) statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2200);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();
    cw = r.width; ch = r.height;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ts = Math.max(8, Math.floor(Math.min(cw / COLS, ch / ROWS)));
    ox = Math.floor((cw - ts * COLS) / 2);
    oy = Math.floor((ch - ts * ROWS) / 2);
  }

  function drawItem(item, cx, cy) {
    const s = ts;
    if (item === 'ore') {
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.15, 0, TAU);
      ctx.fillStyle = T.ore; ctx.fill();
      ctx.strokeStyle = T.ink; ctx.lineWidth = 1; ctx.stroke();
    } else {
      const w = s * 0.38, h = s * 0.22;
      ctx.fillStyle = T.metal;
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      ctx.strokeStyle = T.ink; ctx.lineWidth = 1;
      ctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    }
  }

  function drawSpriteCell(c, px, py, s, now) {
    const cx = px + s / 2, cy = py + s / 2;
    if (c.type === 'conveyor') {
      sprite(SPR.belt, px, py, s, s, c.dir * Math.PI / 2);
      if (c.buf) drawItem(c.buf.item, cx, cy);
    } else if (c.type === 'miner') {
      sprite(SPR.miner, px, py, s, s);
      if (c.buf) drawItem(c.buf.item, px + s * 0.8, py + s * 0.2);
    } else if (c.type === 'smelter') {
      sprite(SPR.smelter, px, py, s, s);
      ctx.fillStyle = '#fff';
      for (let i = 0; i < c.inCount; i++) {
        ctx.beginPath(); ctx.arc(px + s * 0.3 + i * s * 0.12, py + s * 0.3, s * 0.045, 0, TAU); ctx.fill();
      }
      if (c.buf) drawItem(c.buf.item, cx, cy + s * 0.12);
    } else if (c.type === 'sink') {
      sprite(SPR.sink, px, py, s, s);
    }
    return true;
  }

  function drawCell(c, x, y, px, py, now) {
    const s = ts, m = s * 0.1, cx = px + s / 2, cy = py + s / 2;

    if (c.ore) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = T.ore;
      ctx.fillRect(px + 1, py + 1, s - 2, s - 2);
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = T.ore;
      for (const [fx, fy] of [[.3, .35], [.66, .58], [.4, .74]]) {
        ctx.beginPath(); ctx.arc(px + s * fx, py + s * fy, s * 0.05, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (c.type && sheetReady && drawSpriteCell(c, px, py, s, now)) return;
    if (c.type === 'conveyor') {
      ctx.fillStyle = T.belt;
      ctx.fillRect(px + m * 0.5, py + m * 0.5, s - m, s - m);
      const [dx, dy] = DIRS[c.dir];
      const phase = paused ? 0 : (now % TICK_MS) / TICK_MS;
      ctx.strokeStyle = T.paper; ctx.globalAlpha = 0.45;
      ctx.lineWidth = Math.max(1, s * 0.07);
      ctx.setLineDash([s * 0.12, s * 0.22]);
      ctx.lineDashOffset = -phase * s * 0.34;
      ctx.beginPath();
      ctx.moveTo(cx - dx * s * 0.35, cy - dy * s * 0.35);
      ctx.lineTo(cx + dx * s * 0.35, cy + dy * s * 0.35);
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (c.buf) drawItem(c.buf.item, cx, cy);
    } else if (c.type === 'miner') {
      ctx.fillStyle = T.accent;
      ctx.fillRect(px + m, py + m, s - 2 * m, s - 2 * m);
      ctx.strokeStyle = T.paper; ctx.lineWidth = Math.max(1, s * 0.07);
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.22, 0, TAU); ctx.stroke();
      const a = paused ? 0 : now / 300;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * s * 0.22, cy + Math.sin(a) * s * 0.22);
      ctx.stroke();
      if (c.buf) drawItem(c.buf.item, px + s * 0.8, py + s * 0.2);
    } else if (c.type === 'smelter') {
      ctx.fillStyle = T.teal;
      ctx.fillRect(px + m, py + m, s - 2 * m, s - 2 * m);
      if (c.inCount > 0 && !paused) {
        ctx.globalAlpha = 0.25 + 0.2 * Math.sin(now / 150);
        ctx.fillStyle = T.paper;
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.26, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = T.paper;
      for (let i = 0; i < c.inCount; i++) {
        ctx.beginPath(); ctx.arc(px + s * 0.3 + i * s * 0.12, py + s * 0.3, s * 0.045, 0, TAU); ctx.fill();
      }
      if (c.buf) drawItem(c.buf.item, cx, cy + s * 0.12);
      if (c.timer > 0 && !c.buf) {
        ctx.fillStyle = T.paper;
        ctx.fillRect(px + m * 2, py + s - m * 2.5, (s - m * 4) * (c.timer / 2), Math.max(2, s * 0.06));
      }
    } else if (c.type === 'sink') {
      ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(px + m, py + m, s - 2 * m, s - 2 * m);
      ctx.setLineDash([]);
      ctx.fillStyle = T.ink;
      ctx.font = `700 ${Math.round(s * 0.5)}px "Big Shoulders Display", Impact, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, cy + s * 0.03);
    }
  }

  function drawBackground() {
    // Void around the factory floor, with scattered specks.
    ctx.fillStyle = T.paper;
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 90; i++) {
      const sx = ((i * 9301 + 49297) % 233280) / 233280;
      const sy = ((i * 7919 + 1237) % 233280) / 233280;
      ctx.fillRect(Math.floor(sx * cw), Math.floor(sy * ch), 2, 2);
    }
    // Steel frame around the floor
    const fr = Math.max(6, Math.round(ts * 0.45));
    const fx = ox - fr, fy = oy - fr, fw = COLS * ts + fr * 2, fh = ROWS * ts + fr * 2;
    ctx.fillStyle = '#3A2C35';
    ctx.fillRect(fx - 2, fy - 2, fw + 4, fh + 4);
    ctx.fillStyle = '#B9C6D2';
    ctx.fillRect(fx, fy, fw, fh);
    ctx.fillStyle = '#8F9FAF';
    ctx.fillRect(fx, fy + fh - fr * 0.3, fw, fr * 0.3);
    ctx.fillStyle = '#F0A03C';
    for (let x = fx + fr; x < fx + fw - fr / 2; x += ts * 2) {
      ctx.fillRect(x, fy + fr * 0.25, fr * 0.5, fr * 0.5);
    }
    // Checkered factory floor
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (sheetReady) {
        sprite(SPR.floor, ox + x * ts, oy + y * ts, ts, ts);
      } else {
        ctx.fillStyle = (x + y) % 2 ? '#E0A66A' : '#D99A5C';
        ctx.fillRect(ox + x * ts, oy + y * ts, ts, ts);
      }
    }
    // Pixel dither dots
    ctx.fillStyle = 'rgba(120,70,40,0.25)';
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if ((x * 3 + y * 5) % 7 === 0) {
        ctx.fillRect(ox + x * ts + ts * 0.2, oy + y * ts + ts * 0.6, Math.max(1, ts * 0.08), Math.max(1, ts * 0.08));
      }
    }
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    drawBackground();

    // Floor grid lines
    ctx.strokeStyle = 'rgba(60,40,50,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= COLS; x++) {
      const px = Math.round(ox + x * ts) + 0.5;
      ctx.moveTo(px, oy); ctx.lineTo(px, oy + ROWS * ts);
    }
    for (let y = 0; y <= ROWS; y++) {
      const py = Math.round(oy + y * ts) + 0.5;
      ctx.moveTo(ox, py); ctx.lineTo(ox + COLS * ts, py);
    }
    ctx.stroke();

    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      drawCell(grid[y][x], x, y, ox + x * ts, oy + y * ts, now);
    }

    // Placement ghost
    if (hover && tool !== 'remove') {
      const [hx, hy] = hover;
      const c = grid[hy][hx];
      const px = ox + hx * ts, py = oy + hy * ts;
      let ok = !c.type || c.type === tool;
      if (tool === 'miner' && !c.ore) ok = false;
      if (!c.type && money < COST[tool]) ok = false;
      ctx.strokeStyle = ok ? T.ink : T.accent;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(px + 2, py + 2, ts - 4, ts - 4);
      ctx.setLineDash([]);
      if (tool === 'conveyor' && ok) {
        const [dx, dy] = DIRS[rot];
        const cx = px + ts / 2, cy = py + ts / 2;
        ctx.strokeStyle = T.ink; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - dx * ts * 0.2, cy - dy * ts * 0.2);
        ctx.lineTo(cx + dx * ts * 0.2, cy + dy * ts * 0.2);
        ctx.stroke();
      }
    } else if (hover && tool === 'remove') {
      const [hx, hy] = hover;
      ctx.strokeStyle = T.accent; ctx.lineWidth = 2;
      ctx.strokeRect(ox + hx * ts + 2, oy + hy * ts + 2, ts - 4, ts - 4);
    }
  }

  function updateUI(force) {
    moneyEl.textContent = '$' + money.toLocaleString('en-US');
    soldEl.textContent = stats.sold.toLocaleString('en-US');
    pauseBtn.firstChild.textContent = paused ? 'Resume ' : 'Pause ';
    speedBtn.textContent = speed + '×';
    toolbar.querySelectorAll('[data-tool]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
    });
    const html = goals.map(g => {
      const cur = Math.min(g.cur(), g.goal);
      const done = cur >= g.goal;
      return `<li class="${done ? 'done' : ''}"><span>${g.label}</span><span>${cur.toLocaleString('en-US')}/${g.goal.toLocaleString('en-US')}</span></li>`;
    }).join('');
    if (force || goalsEl.dataset.sig !== html) {
      goalsEl.innerHTML = html;
      goalsEl.dataset.sig = html;
    }
  }

  function tileAt(e) {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left - ox) / ts);
    const y = Math.floor((e.clientY - r.top - oy) / ts);
    return (x >= 0 && y >= 0 && x < COLS && y < ROWS) ? [x, y] : null;
  }

  canvas.addEventListener('pointerdown', e => {
    const t = tileAt(e);
    if (!t) return;
    canvas.setPointerCapture(e.pointerId);
    painting = true;
    place(t[0], t[1]);
    lastTile = t;
    hover = t;
  });
  canvas.addEventListener('pointermove', e => {
    const t = tileAt(e);
    hover = t;
    if (painting && t && (!lastTile || t[0] !== lastTile[0] || t[1] !== lastTile[1])) {
      place(t[0], t[1]);
      lastTile = t;
    }
  });
  const endPaint = () => { painting = false; lastTile = null; };
  canvas.addEventListener('pointerup', endPaint);
  canvas.addEventListener('pointercancel', endPaint);
  canvas.addEventListener('pointerleave', () => { if (!painting) hover = null; });
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const t = tileAt(e);
    if (!t) return;
    const prev = tool; tool = 'remove'; place(t[0], t[1]); tool = prev;
  });

  toolbar.addEventListener('click', e => {
    const b = e.target.closest('[data-tool]');
    if (b) { tool = b.dataset.tool; updateUI(); }
  });
  document.getElementById('rotBtn').addEventListener('click', () => { rot = (rot + 1) % 4; });
  pauseBtn.addEventListener('click', () => { paused = !paused; updateUI(); });
  speedBtn.addEventListener('click', () => {
    speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
    updateUI();
  });
  document.getElementById('resetBtn').addEventListener('click', () => newGame());

  const toolKeys = { '1': 'conveyor', '2': 'miner', '3': 'smelter', '4': 'sink', 'x': 'remove', 'X': 'remove' };
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); paused = !paused; updateUI(); }
    else if (toolKeys[e.key]) { tool = toolKeys[e.key]; updateUI(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { tool = 'remove'; updateUI(); }
    else if (e.key === 'r' || e.key === 'R') rot = (rot + 1) % 4;
    else if (e.key === 'g' || e.key === 'G') toggleSheet();
  });

  function toggleSheet() {
    const old = document.getElementById('sheetBox');
    if (old) return old.remove();
    const box = document.createElement('div');
    box.id = 'sheetBox';
    box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:min(92vw,918px)';
    const img = new Image();
    img.src = 'Preview.png';
    img.style.cssText = 'width:100%;display:block;image-rendering:pixelated';
    wrap.appendChild(img);
    const W = 918, H = 515;
    for (let r = 0; r < SHEET.rows; r++) for (let c = 0; c < SHEET.cols; c++) {
      const tag = document.createElement('div');
      tag.textContent = c + ',' + r;
      const left = SHEET.x0 + c * SHEET.pitch, top = SHEET.y0 + r * SHEET.pitch;
      tag.style.cssText = `position:absolute;left:${left / W * 100}%;top:${top / H * 100}%;width:${SHEET.t / W * 100}%;height:${SHEET.t / H * 100}%;color:#FFD54A;font:600 10px system-ui;text-shadow:0 0 3px #000;border:1px solid rgba(255,213,74,.35);box-sizing:border-box;padding:1px 2px;pointer-events:none`;
      wrap.appendChild(tag);
    }
    box.appendChild(wrap);
    box.addEventListener('click', () => box.remove());
    document.body.appendChild(box);
  }
  document.getElementById('sheetBtn').addEventListener('click', toggleSheet);

  window.addEventListener('resize', resize);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);

  let last = performance.now(), acc = 0, lastUI = 0;
  function frame(now) {
    const dt = Math.min(250, now - last);
    last = now;
    if (!paused) {
      acc += dt * speed;
      while (acc >= TICK_MS) { acc -= TICK_MS; step(); }
    }
    draw(now);
    if (now - lastUI > 200) { updateUI(); lastUI = now; }
    requestAnimationFrame(frame);
  }

  // Build the toolbar labels from COST so they stay in sync.
  toolbar.querySelectorAll('[data-tool]').forEach(b => {
    const cost = COST[b.dataset.tool];
    const small = b.querySelector('small');
    if (cost && !small) b.insertAdjacentHTML('beforeend', `<small>$${cost}</small>`);
  });

  readTheme();
  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
